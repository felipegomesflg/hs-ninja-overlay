[package]
name = "hs-capture"
version = "0.1.0"
edition = "2021"
description = "Hero Siege live capture for hs-ninja-overlay (room + satanic zone)"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "hs-capture"
path = "src/main.rs"

[dependencies]
pcap = "2"
etherparse = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"
sysinfo = "0.33"
netstat2 = "0.11"
